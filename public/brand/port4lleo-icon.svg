<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>PORT4LLEO</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13305c"/>
      <stop offset="1" stop-color="#0a1830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.88) translate(-455 -512)">
  <!-- Leo, drawn as a commit graph: sickle (head) + body to Denebola (tail) -->
  <g fill="none" stroke="#86b6ef" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <polyline points="172,785 196,615 245,469 196,335 294,238 391,299"/>
    <polyline points="245,469 609,518 852,663 634,712 172,785"/>
  </g>
  <circle cx="172" cy="785" r="120" fill="url(#glow)"/>
  <g fill="#ffffff" stroke="#3987e5" stroke-width="12">
    <circle cx="196" cy="615" r="28"/>
    <circle cx="245" cy="469" r="32"/>
    <circle cx="196" cy="335" r="26"/>
    <circle cx="294" cy="238" r="26"/>
    <circle cx="391" cy="299" r="28"/>
    <circle cx="609" cy="518" r="30"/>
    <circle cx="634" cy="712" r="28"/>
    <circle cx="852" cy="663" r="34"/>
  </g>
  <!-- Regulus: the brightest star, the highlighted commit -->
  <circle cx="172" cy="785" r="46" fill="#ffd166" stroke="#fff4d6" stroke-width="12"/>
  </g>
</svg>
